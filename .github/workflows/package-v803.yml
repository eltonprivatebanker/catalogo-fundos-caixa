name: Pacote Focus V803

on:
  push:
    branches:
      - 'Testes-da-versão-01'
    paths:
      - '.github/workflows/package-v803.yml'

permissions:
  contents: read

jobs:
  pacote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: 'Testes-da-versão-01'

      - name: Montar pacote
        shell: bash
        run: |
          mkdir -p pacote-v803
          cp index.html pacote-v803/
          cp focus-v802.css pacote-v803/
          cp focus-v803.js pacote-v803/
          printf '%s\n' \
            'V803 — Boletim Focus' \
            '' \
            'Arquivos incluídos:' \
            '- index.html' \
            '- focus-v802.css (contém os overrides finais V803)' \
            '- focus-v803.js' \
            '' \
            'Branch de origem: Testes-da-versão-01' \
            > pacote-v803/LEIA-ME.txt

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: Focus-V803-arquivos-atualizados
          path: pacote-v803/
          retention-days: 7
