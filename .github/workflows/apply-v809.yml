name: Aplicar Market V809

on:
  push:
    branches:
      - 'Testes-da-versão-01'
    paths:
      - '.github/workflows/apply-v809.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'Testes-da-versão-01'
          fetch-depth: 0

      - name: Remover painel duplicado e patches antigos
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = s

          # Remove estruturalmente o segundo painel de mercado inteiro.
          start_markers = [
              '<!-- ═════════════════════════════════ APROFUNDAMENTO MACRO ══ -->',
              '<!-- ══════════════════ PAINEL CONSOLIDADO DE INDICADORES ══ -->',
          ]
          start = -1
          for marker in start_markers:
              pos = s.find(marker)
              if pos != -1:
                  start = pos
                  break

          end_marker = '</div><!-- /section painel consolidado -->'
          end = s.find(end_marker, start if start != -1 else 0)

          if start == -1 or end == -1:
              raise SystemExit('Não foi possível localizar com segurança o painel consolidado duplicado.')

          end += len(end_marker)
          while end < len(s) and s[end] in '\r\n':
              end += 1
          s = s[:start] + s[end:]

          # Remove patches temporários V807/V808, agora desnecessários.
          obsolete = [
              '<link rel="stylesheet" href="market-v807.css?v=market-v807"/>\n',
              '<link rel="stylesheet" href="market-v808.css?v=market-v808"/>\n',
              '<script src="market-v807.js?v=market-v807" defer></script>\n',
              '<script src="market-v808.js?v=market-v808" defer></script>\n',
          ]
          for tag in obsolete:
              s = s.replace(tag, '')

          # Validações da V809.
          if '📊 Painel consolidado de indicadores' in s:
              raise SystemExit('O painel duplicado ainda está presente após a limpeza.')
          if 'id="sec-mercado-painel"' in s:
              raise SystemExit('O container duplicado sec-mercado-painel ainda está presente.')
          if 'id="sec-dolar"' not in s:
              raise SystemExit('A seção Dólar PTAX foi afetada indevidamente.')
          if 'id="monthlyComparisonChartV580"' not in s:
              raise SystemExit('O comparativo principal de indicadores foi afetado indevidamente.')
          if s == old:
              raise SystemExit('Nenhuma alteração V809 foi aplicada.')

          p.write_text(s, encoding='utf-8')

      - name: Commit V809
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'V809: remover painel duplicado de indicadores'
          git push origin HEAD:'Testes-da-versão-01'
