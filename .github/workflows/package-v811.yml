name: Pacote Catalog Risk V811

on:
  push:
    branches:
      - 'Testes-da-versão-01'
    paths:
      - '.github/workflows/package-v811.yml'

permissions:
  contents: read

jobs:
  pacote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'Testes-da-versão-01'

      - name: Montar pacote
        shell: bash
        run: |
          mkdir -p pacote-v811
          cp index.html pacote-v811/
          cp catalog-risk-v811.css pacote-v811/
          cp catalog-risk-v811.js pacote-v811/
          cp focus-v806.css pacote-v811/ 2>/dev/null || true
          cp focus-v806.js pacote-v811/ 2>/dev/null || true
          printf '%s\n' \
            'V811 — Perfil de risco do catálogo' \
            '' \
            'Correções:' \
            '- menu customizado renderizado em portal no body' \
            '- elimina recorte por overflow dos filtros' \
            '- abertura permanece neutra em Todos os perfis' \
            '- dourado apenas quando existe filtro específico' \
            '- mantém select original e lógica de filtragem' \
            > pacote-v811/LEIA-ME.txt

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: Catalog-Risk-V811-arquivos-atualizados
          path: pacote-v811/
          retention-days: 7
