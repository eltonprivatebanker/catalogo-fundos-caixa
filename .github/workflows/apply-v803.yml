name: Aplicar Focus V803

on:
  push:
    branches:
      - 'Testes-da-versão-01'
    paths:
      - '.github/workflows/apply-v803.yml'

permissions:
  contents: write

jobs:
  aplicar-v803:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: 'Testes-da-versão-01'
          fetch-depth: 0

      - name: Atualizar index
        shell: bash
        run: |
          python -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(encoding='utf-8'); s=s.replace('ℹ️ Entenda o Boletim Focus','ℹ️ Como interpretar o Boletim Focus'); tag='<script src=\"focus-v803.js?v=focus-v803\" defer></script>'; s=s if tag in s else s.replace('</body>',tag+'\n</body>'); p.write_text(s,encoding='utf-8')"

      - name: Commit V803
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git commit -m "V803: carregar acabamento final do Boletim Focus"
          git push origin HEAD:'Testes-da-versão-01'
