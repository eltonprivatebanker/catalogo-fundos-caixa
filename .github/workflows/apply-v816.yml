name: Aplicar Market Month Focus V816

on:
  push:
    branches:
      - 'Testes-da-versão-01'
    paths:
      - '.github/workflows/apply-v816.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'Testes-da-versão-01'
          fetch-depth: 0

      - name: Atualizar index para V816
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = s

          s = s.replace('<link rel="stylesheet" href="market-month-detail-v815.css?v=market-month-detail-v815"/>\n','')
          s = s.replace('<script src="market-month-detail-v815.js?v=market-month-detail-v815" defer></script>\n','')

          css_anchor = '<link rel="stylesheet" href="market-table-v814.css?v=market-table-v814"/>'
          css_new = css_anchor + '\n<link rel="stylesheet" href="market-month-focus-v816.css?v=market-month-focus-v816"/>'
          if 'market-month-focus-v816.css' not in s:
              if css_anchor not in s:
                  raise SystemExit('Âncora CSS V814 não encontrada.')
              s = s.replace(css_anchor, css_new, 1)

          js_anchor = '<script src="market-table-v814.js?v=market-table-v814" defer></script>'
          js_new = js_anchor + '\n<script src="market-month-focus-v816.js?v=market-month-focus-v816" defer></script>'
          if 'market-month-focus-v816.js' not in s:
              if js_anchor not in s:
                  raise SystemExit('Âncora JS V814 não encontrada.')
              s = s.replace(js_anchor, js_new, 1)

          if 'market-month-detail-v815.css' in s or 'market-month-detail-v815.js' in s:
              raise SystemExit('Referências V815 ainda presentes no index.')
          if 'market-month-focus-v816.css' not in s or 'market-month-focus-v816.js' not in s:
              raise SystemExit('Referências V816 não foram aplicadas.')
          if s == old:
              raise SystemExit('Nenhuma alteração aplicada.')

          p.write_text(s, encoding='utf-8')

      - name: Commit V816
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'V816: mês da tabela controla gráfico principal'
          git push origin HEAD:'Testes-da-versão-01'
