name: Aplicar Focus V804

on:
  push:
    branches:
      - 'Testes-da-versão-01'
    paths:
      - '.github/workflows/apply-v804.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'Testes-da-versão-01'
      - name: Atualizar referências
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('focus-v802.css?v=focus-v802', 'focus-v804.css?v=focus-v804')
          s = s.replace('focus-v803.js?v=focus-v803', 'focus-v804.js?v=focus-v804')
          p.write_text(s, encoding='utf-8')
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "V804: carregar CSS e JS atualizados do Focus"
          git push origin HEAD:'Testes-da-versão-01'
