name: Atualizacao Diaria Caixa

on:
  schedule:
    # Rodada da noite — 23:45 horário de Brasília, de segunda a sexta
    # Como o GitHub Actions usa UTC, isso roda às 02:45 UTC do dia seguinte.
    # Segunda a sexta no Brasil = terça a sábado em UTC.
    - cron: '45 2 * * 2-6'

    # Rodada da manhã — 06:05 horário de Brasília, de segunda a sexta
    # 06:05 BRT = 09:05 UTC.
    - cron: '5 9 * * 1-5'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizacao-diaria-caixa
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Chrome
        run: |
          sudo apt-get update -q
          sudo apt-get install -y google-chrome-stable

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar o Robo
        run: python robo_sipii_simples.py

      - name: Salvar Resultados no GitHub
        run: |
          git config --global user.name "actions-user"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Dados atualizados via Robô: $(TZ=America/Sao_Paulo date +'%d/%m/%Y %H:%M')" || echo "Sem mudanças para salvar"
          git push
