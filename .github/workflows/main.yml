name: Atualizacao Diaria Caixa

on:
  schedule:
    - cron: '17 13 * * 1-5'

  workflow_dispatch:
    inputs:
      modo:
        description: "Qual rotina deseja executar?"
        required: true
        default: "full"
        type: choice
        options:
          - debug-selic
          - indicadores
          - fundos
          - metadados
          - full

permissions:
  contents: write

concurrency:
  group: catalogo-fundos-atualizacao
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      TZ: America/Sao_Paulo

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
        with:
          ref: Testes-da-versão-01
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Chrome
        run: |
          sudo apt-get update -q
          sudo apt-get install -y google-chrome-stable

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Definir modo de execucao
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "MODO=full" >> $GITHUB_ENV
          else
            echo "MODO=${{ github.event.inputs.modo }}" >> $GITHUB_ENV
          fi

      - name: Executar o Robo
        run: python robo_sipii_simples.py --modo "$MODO"

      - name: Salvar Resultados no GitHub
        run: |
          git config --global user.name "actions-user"
          git config --global user.email "actions@github.com"

          git add .

          if git diff --cached --quiet; then
            echo "Sem mudanças para salvar."
            exit 0
          fi

          git commit -m "Dados atualizados via Robô [$MODO]: $(date +'%d/%m/%Y %H:%M')"

          git fetch origin Testes-da-versão-01
          git rebase origin/Testes-da-versão-01

          git push origin HEAD:Testes-da-versão-01
