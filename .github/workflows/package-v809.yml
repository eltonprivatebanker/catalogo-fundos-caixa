name: Pacote Market V809

on:
  push:
    branches:
      - 'Testes-da-versão-01'
    paths:
      - '.github/workflows/package-v809.yml'

permissions:
  contents: read

jobs:
  pacote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'Testes-da-versão-01'

      - name: Montar pacote
        shell: bash
        run: |
          mkdir -p pacote-v809
          cp index.html pacote-v809/
          cp focus-v806.css pacote-v809/
          cp focus-v806.js pacote-v809/
          cp indicadores-v801.css pacote-v809/
          printf '%s\n' \
            'V809 — limpeza estrutural dos Indicadores de Mercado' \
            '' \
            'Alteração principal:' \
            '- Remoção definitiva do segundo painel duplicado de indicadores diretamente do index.html.' \
            '- Mantido apenas Resumo do período + Comparativo + gráfico + tabela mensal.' \
            '- Removidas as referências temporárias market-v807 e market-v808.' \
            '- Dólar PTAX e demais seções preservadas.' \
            '' \
            'Arquivos incluídos:' \
            '- index.html' \
            '- indicadores-v801.css' \
            '- focus-v806.css' \
            '- focus-v806.js' \
            > pacote-v809/LEIA-ME.txt

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: Market-V809-arquivos-atualizados
          path: pacote-v809/
          retention-days: 7
