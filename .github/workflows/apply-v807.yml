name: Aplicar Market V807

on:
  push:
    branches:
      - 'Testes-da-versão-01'
    paths:
      - '.github/workflows/apply-v807.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'Testes-da-versão-01'
          fetch-depth: 0

      - name: Atualizar index para V807
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = s
          css_tag = '<link rel="stylesheet" href="market-v807.css?v=market-v807"/>'
          js_tag = '<script src="market-v807.js?v=market-v807" defer></script>'
          if css_tag not in s:
              s = s.replace('</head>', css_tag + '\n</head>')
          if js_tag not in s:
              s = s.replace('</body>', js_tag + '\n</body>')
          if s == old:
              raise SystemExit('V807 já estava carregada no index.html')
          p.write_text(s, encoding='utf-8')

      - name: Commit V807
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'V807: simplificar painel consolidado de indicadores'
          git push origin HEAD:'Testes-da-versão-01'
