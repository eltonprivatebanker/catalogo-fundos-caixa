name: Pacote Focus V806

on:
  push:
    branches:
      - 'Testes-da-versão-01'
    paths:
      - '.github/workflows/package-v806.yml'

permissions:
  contents: read

jobs:
  pacote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'Testes-da-versão-01'

      - name: Montar pacote
        shell: bash
        run: |
          mkdir -p pacote-v806
          cp index.html pacote-v806/
          cp focus-v806.css pacote-v806/
          cp focus-v806.js pacote-v806/
          printf '%s\n' \
            'V806 — Boletim Focus' \
            '' \
            'Ajustes finais:' \
            '- Remove o sublinhado/decoração visual da Síntese do cenário.' \
            '- Aumenta discretamente queda / leve alta / oscila.' \
            '- Aumenta discretamente Variação no horizonte.' \
            '- Mantém estrutura V805 estável, valores anuais, gráficos e cálculos.' \
            '' \
            'Arquivos:' \
            '- index.html' \
            '- focus-v806.css' \
            '- focus-v806.js' \
            > pacote-v806/LEIA-ME.txt

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: Focus-V806-arquivos-atualizados
          path: pacote-v806/
          retention-days: 7
