<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Fundos | Private Banking</title>
    
    <link rel="stylesheet" href="style.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body>

    <main class="page-container">
        
        <header class="header-section">
            <h1>Catálogo de Fundos</h1>
            <div id="dashboard-kpis" class="kpi-grid">
                </div>
        </header>

        <section class="controls-section">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Buscar fundo, CNPJ, benchmark...">
            </div>
            
            <div class="filter-groups" id="filterContainer">
                 </div>
        </section>

        <section class="table-section">
            <div id="loadMsg" class="loading-msg">Carregando dados dos fundos...</div>
            
            <div class="table-wrapper">
                <table id="mainTable" style="display: none;">
                    <thead id="tableHead">
                        </thead>
                    <tbody id="tableBody">
                        </tbody>
                </table>
            </div>
            
            <div class="pagination-section">
                <div id="resultInfo" class="result-info"></div>
                <div id="pageBtns" class="page-btns"></div>
            </div>
        </section>

        <section class="rankings-section">
            <div id="rankings-container" class="rankings-wrapper">
                 </div>
        </section>

    </main>

    <script src="app.js"></script>
</body>
</html>
