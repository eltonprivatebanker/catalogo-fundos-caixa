<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rankings dos Fundos | Private Banking</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="dashboard-grid">
        
        <header class="header-container">
            <h1>Rankings dos Fundos</h1>
            <div id="filtros-container" class="filtros">
                <button class="btn-filtro ativo">Todos</button>
                <button class="btn-filtro">Renda Fixa</button>
                <button class="btn-filtro">Ações</button>
                <button class="btn-filtro">Multimercado</button>
            </div>
        </header>

        <section class="kpi-container" id="kpi-cards">
            <!-- Gerado via JS -->
        </section>

        <main class="main-table-container">
            <table id="tabela-fundos">
                <thead>
                    <tr>
                        <th>Fundo</th>
                        <th class="align-right">Retorno 12M</th>
                        <th class="align-right">% CDI 12M</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Gerado via JS -->
                </tbody>
            </table>
        </main>

    </div>

    <script src="app.js"></script>
</body>
</html>
